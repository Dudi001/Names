<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — 99 имён Аллаха</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-amber-50 font-sans text-gray-900 transition-colors duration-300 dark:bg-gray-700 dark:text-white">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10">
    <section class="w-full rounded-2xl bg-white p-6 shadow-xl transition-colors duration-300 dark:bg-gray-800 sm:p-8">
      <div class="mb-8 flex items-center justify-between">
        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-medium text-violet-700 hover:text-violet-900 dark:text-violet-300"><span aria-hidden="true">←</span>К именам</a>
        <label class="theme-switch" aria-label="Переключить тему"><input type="checkbox" id="themeToggle"><span class="slider"></span></label>
      </div>
      <div class="mb-8 text-center">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-violet-600">99 имён Аллаха</p>
        <h1 class="text-2xl font-bold sm:text-3xl">С возвращением</h1>
        <p class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300">Войдите, чтобы продолжить обучение.</p>
      </div>
      <form id="loginForm" class="space-y-4">
        <div>
          <label for="username" class="mb-1 block text-sm font-medium">Логин</label>
          <input id="username" name="username" type="text" autocomplete="username" required placeholder="Ваш логин" class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700">
        </div>
        <div>
          <label for="password" class="mb-1 block text-sm font-medium">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="Ваш пароль" class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700">
        </div>
        <button type="submit" class="mt-2 w-full rounded-lg bg-violet-600 px-4 py-3 font-bold text-white transition hover:bg-violet-700">Войти</button>
        <p id="formMessage" class="hidden rounded-lg px-3 py-2 text-center text-sm" role="alert"></p>
      </form>
      <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-300">Нет аккаунта? <a href="registration.html" class="font-semibold text-violet-700 hover:text-violet-900 dark:text-violet-300">Зарегистрироваться</a></p>
    </section>
  </main>
  <script src="./auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = new FormData(form);
        const button = form.querySelector('button[type="submit"]');
        button.disabled = true;
        button.textContent = 'Входим…';
        try {
          await login(data.get('username'), data.get('password'));
          window.location.replace('index.html');
        } catch (error) {
          showMessage(error.message);
          button.disabled = false;
          button.textContent = 'Войти';
        }
      });
    });
  </script>
</body>
</html>
