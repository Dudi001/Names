<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация — 99 имён Аллаха</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen font-sans bg-amber-50 text-gray-900 transition-colors duration-300 dark:bg-gray-700 dark:text-white">
  <main class="mx-auto flex min-h-screen max-w-md items-center px-4 py-10">
    <section class="w-full rounded-2xl bg-white p-6 shadow-xl transition-colors duration-300 dark:bg-gray-800 sm:p-8">
      <div class="mb-8 flex items-center justify-between">
        <a href="index.html" class="inline-flex items-center gap-2 text-sm font-medium text-violet-700 hover:text-violet-900 dark:text-violet-300 dark:hover:text-violet-200">
          <span aria-hidden="true">←</span>
          К именам
        </a>
        <label class="theme-switch" aria-label="Переключить тему">
          <input type="checkbox" id="themeToggle">
          <span class="slider"></span>
        </label>
      </div>

      <div class="mb-8 text-center">
        <p class="mb-2 text-sm font-semibold uppercase tracking-widest text-violet-600">99 имён Аллаха</p>
        <h1 class="text-2xl font-bold sm:text-3xl">Создать аккаунт</h1>
        <p class="mt-3 text-sm leading-6 text-gray-600 dark:text-gray-300">Сохраняйте личный прогресс и повторяйте имена в удобном темпе.</p>
      </div>

      <form id="registrationForm" class="space-y-4" novalidate>
        <div>
          <label for="firstName" class="mb-1 block text-sm font-medium">Имя</label>
          <input id="firstName" name="first_name" type="text" autocomplete="given-name" required
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="Ваше имя">
        </div>

        <div>
          <label for="lastName" class="mb-1 block text-sm font-medium">Фамилия <span class="font-normal text-gray-400">(необязательно)</span></label>
          <input id="lastName" name="last_name" type="text" autocomplete="family-name"
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="Ваша фамилия">
        </div>

        <div>
          <label for="username" class="mb-1 block text-sm font-medium">Логин</label>
          <input id="username" name="username" type="text" autocomplete="username" required
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="Например, murad96">
        </div>

        <div>
          <label for="email" class="mb-1 block text-sm font-medium">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="you@example.com">
        </div>

        <div>
          <label for="password" class="mb-1 block text-sm font-medium">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="5" required
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="Минимум 5 символов">
          <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Не менее 5 символов.</p>
        </div>

        <div>
          <label for="passwordConfirmation" class="mb-1 block text-sm font-medium">Повторите пароль</label>
          <input id="passwordConfirmation" name="password_confirmation" type="password" autocomplete="new-password" minlength="5" required
            class="block w-full rounded-lg border border-gray-300 bg-white px-3 py-2.5 outline-none transition focus:border-violet-500 focus:ring-2 focus:ring-violet-200 dark:border-gray-600 dark:bg-gray-700"
            placeholder="Повторите пароль">
        </div>

        <button type="submit" class="mt-2 w-full rounded-lg bg-violet-600 px-4 py-3 font-bold text-white transition hover:bg-violet-700 focus:outline-none focus:ring-2 focus:ring-violet-400 focus:ring-offset-2">
          Зарегистрироваться
        </button>
        <p id="formMessage" class="hidden rounded-lg px-3 py-2 text-center text-sm" role="alert"></p>
      </form>

      <p class="mt-6 text-center text-sm text-gray-600 dark:text-gray-300">
        Уже есть аккаунт?
        <a href="login.html" class="font-semibold text-violet-700 hover:text-violet-900 dark:text-violet-300">Войти</a>
      </p>
    </section>
  </main>
  <script src="./auth.js"></script>
</body>
</html>
