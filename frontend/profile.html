<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Профиль — 99 имён Аллаха</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-amber-50 font-sans text-gray-900 transition-colors duration-300 dark:bg-gray-700 dark:text-white">
  <main class="mx-auto max-w-2xl px-4 py-6 sm:px-6">
    <header class="mb-8 flex items-center justify-between gap-4">
      <a href="index.html" class="inline-flex items-center gap-2 rounded-lg bg-fuchsia-700 px-4 py-2 font-semibold text-white transition hover:bg-fuchsia-800"><span aria-hidden="true">←</span>На главную</a>
      <label class="theme-switch" aria-label="Переключить тему"><input type="checkbox" id="themeToggle"><span class="slider"></span></label>
    </header>
    <section class="rounded-2xl bg-white p-6 shadow-xl transition-colors duration-300 dark:bg-gray-800 sm:p-8">
      <div class="flex items-center gap-4 border-b border-gray-200 pb-6 dark:border-gray-700">
        <div id="profileInitial" class="flex h-16 w-16 items-center justify-center rounded-full bg-violet-600 text-2xl font-bold text-white">?</div>
        <div>
          <h1 id="profileName" class="text-2xl font-bold">Загрузка профиля…</h1>
          <p id="profileEmail" class="mt-1 text-sm text-gray-600 dark:text-gray-300"></p>
        </div>
      </div>
      <div class="mt-7">
        <h2 class="text-lg font-bold">Статистика обучения</h2>
        <div class="mt-4 grid grid-cols-1 gap-3 sm:grid-cols-3">
          <article class="rounded-xl bg-violet-50 p-4 text-center dark:bg-violet-950"><p id="totalCards" class="text-3xl font-bold text-violet-700 dark:text-violet-300">—</p><p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Всего карточек</p></article>
          <article class="rounded-xl bg-green-50 p-4 text-center dark:bg-green-950"><p id="learnedCards" class="text-3xl font-bold text-green-700 dark:text-green-300">—</p><p class="mt-1 text-sm text-gray-600 dark:text-gray-300">Выучено</p></article>
          <article class="rounded-xl bg-amber-50 p-4 text-center dark:bg-amber-950"><p id="dueCards" class="text-3xl font-bold text-amber-700 dark:text-amber-300">—</p><p class="mt-1 text-sm text-gray-600 dark:text-gray-300">На сегодня</p></article>
        </div>
      </div>
      <p id="profileMessage" class="mt-6 hidden rounded-lg px-3 py-2 text-center text-sm" role="alert"></p>
      <button id="logoutButton" type="button" class="mt-8 w-full rounded-lg bg-gray-200 px-4 py-3 font-bold text-gray-800 transition hover:bg-gray-300 dark:bg-gray-700 dark:text-white dark:hover:bg-gray-600">Выйти из аккаунта</button>
    </section>
  </main>
  <script src="./profile.js"></script>
</body>
</html>
